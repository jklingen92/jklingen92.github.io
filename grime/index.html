<!doctype html>
<!-- Static demo of grime's document viewer. Markup follows
     grime/templates/grime/base.html + document_detail.html. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Grime viewer demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous">
  <style>*,:before,:after{box-sizing:border-box}body{margin:0;font-family:Roboto,Lucida Grande,DejaVu Sans,Bitstream Vera Sans,Verdana,Arial,sans-serif}#gd-header{color:#fff;background:#417690;align-items:center;gap:10px;padding:8px 16px;display:flex}#gd-header a{color:#c8dce8;font-size:.85em;text-decoration:none}#gd-header a:hover{text-decoration:underline}#gd-header h1{margin:0;font-size:1em;font-weight:600}#demo-banner{color:#664d03;background:#fff3cd;border-bottom:1px solid #ffe69c;flex-wrap:wrap;align-items:center;gap:12px;padding:6px 16px;font-size:.85em;display:flex}#demo-banner a{color:inherit}#demo-reset{margin-left:auto}</style>
  <script type="module" crossorigin src="/grime/assets/index-CFnUskCt.js"></script>
  <link rel="stylesheet" crossorigin href="/grime/assets/index-2UGKt_OR.css">
</head>
<body>

<div id="gd-header">
  <span>Grime</span>
  <i class="fa-solid fa-chevron-right fa-xs mx-1"></i>
  <h1 id="demo-title"></h1>
</div>
<div id="demo-banner" role="note">
  <span>
    <strong>Demo:</strong> a static copy of grime's document viewer. The OCR on this page
    was poorly run, so there's plenty to correct. OCR/NER jobs, PDF export and saving image
    adjustments are off, and edits stay in your browser.
    <a href="https://github.com/jklingen92/grime">Source on GitHub</a>
  </span>
  <button id="demo-reset" type="button" class="btn btn-sm btn-outline-dark">Reset demo</button>
</div>

<main id="gd-body" style="padding:12px 16px">
  <div id="viewer-root"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
